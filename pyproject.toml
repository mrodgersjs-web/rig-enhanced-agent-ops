[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rig-enhanced-agent-ops"
version = "0.1.0"
description = "Proof-gated agent operations with a tamper-evident, HMAC-signed audit trail — the RIG doctrine overlay applied to agent observability/ops."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "RIG", email = "hello@mikerodgers.tech" }]
keywords = [
  "agent-ops",
  "observability",
  "proof-gate",
  "audit-trail",
  "tamper-evident",
  "rig-doctrine",
  "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "behave>=1.2.6"]

[project.urls]
Homepage = "https://github.com/mrodgersjs-web/rig-enhanced-agent-ops"
Repository = "https://github.com/mrodgersjs-web/rig-enhanced-agent-ops"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
  "unit: fast, isolated tests of a single class or function",
  "integration: end-to-end tests across ActionGate + AuditTrail + Verifier",
]
